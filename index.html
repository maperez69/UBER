        const formatCurrency = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(val);

        function App() {
            const [selectedMonth, setSelectedMonth] = useState('Todos');
            const [selectedArea, setSelectedArea] = useState('Todas');
            const [searchTerm, setSearchTerm] = useState('');

            // --- LÓGICA DE PROCESAMIENTO ---
            const processedData = useMemo(() => {
                return DATA.map(p => {
                    let v = 0, m = 0;
                    if (selectedMonth === 'Todos') {
                        Object.values(p.mensual).forEach(entry => {
                            v += entry.v;
                            m += entry.m;
                        });
                    } else {
                        const entry = p.mensual[selectedMonth];
                        if (entry) { v = entry.v; m = entry.m; }
                    }
                    return { ...p, currentViajes: v, currentMonto: m };
                });
            }, [selectedMonth]);

            // Filtrado y Ordenamiento de Mayor a Menor por Monto
            const filteredList = useMemo(() => {
                let result = processedData;
                if (selectedArea !== 'Todas') result = result.filter(d => d.area === selectedArea);
                if (searchTerm) result = result.filter(d => d.nombre.toLowerCase().includes(searchTerm.toLowerCase()));
                
                // Ordenar de Mayor a Menor Monto
                return [...result].sort((a, b) => b.currentMonto - a.currentMonto);
            }, [processedData, selectedArea, searchTerm]);

            const stats = useMemo(() => {
                const totalMonto = filteredList.reduce((acc, curr) => acc + curr.currentMonto, 0);
                const totalViajes = filteredList.reduce((acc, curr) => acc + curr.currentViajes, 0);
                return { totalMonto, totalViajes, avg: totalViajes > 0 ? totalMonto / totalViajes : 0 };
            }, [filteredList]);

            const chartDataArea = useMemo(() => {
                const areas = [...new Set(DATA.map(d => d.area))];
                return areas.map(area => {
                    const group = processedData.filter(p => p.area === area);
                    const monto = group.reduce((s, p) => s + p.currentMonto, 0);
                    const viajes = group.reduce((s, p) => s + p.currentViajes, 0);
                    return { name: area.split(' ')[0], monto, viajes };
                }).sort((a, b) => b.monto - a.monto);
            }, [processedData]);

                                            className="bg-transparent text-sm font-bold outline-none cursor-pointer text-white"
                                            value={selectedMonth}
                                            onChange={(e) => setSelectedMonth(e.target.value)}
                                        >
                                            <option value="Todos" className="text-slate-900">Anual Consolidado</option>
                                            {MESES_FULL.map(m => <option key={m} value={m} className="text-slate-900">{m}</option>)}
                                        </select>
                                    </div>

                                        <label className="text-[10px] font-black text-[#A1D55D] uppercase mb-1">Filtrar Área</label>
                                        <select 
                                            className="bg-transparent text-sm font-bold outline-none cursor-pointer text-white"
                                            value={selectedArea}
                                            onChange={(e) => setSelectedArea(e.target.value)}

                                            <option value="Todas" className="text-slate-900">Todas las áreas</option>

                                </div>

                            {t: "Ticket Promedio", v: formatCurrency(stats.avg), i: "TrendingUp", c: "#5C6670"},

                                        <th className="px-10 py-6 text-right">Inversión</th>
                                        <th className="px-10 py-6 text-right">Ticket Prom.</th>
                                    </tr>
                                </thead>

                                            </td>
                                            <td className="px-10 py-5"><span className="text-[9px] font-black px-3 py-1 rounded-xl bg-white border border-slate-200 text-slate-500 uppercase">{p.area}</span></td>
                                            <td className="px-10 py-5 text-center font-bold text-slate-600">{p.currentViajes || '-'}</td>
                                            <td className="px-10 py-5 text-right font-black text-slate-900">{p.currentMonto > 0 ? formatCurrency(p.currentMonto) : '-'}</td>
                                            <td className="px-10 py-5 text-right font-bold text-[#00AE6E]">{p.currentViajes > 0 ? formatCurrency(p.currentMonto / p.currentViajes) : '-'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* GRÁFICO POR ÁREA (Ahora al final) */}
                    <div className="bg-white p-6 md:p-10 rounded-[3rem] shadow-sm overflow-hidden mb-10">
                        <div className="flex flex-col sm:flex-row justify-between items-center mb-10 gap-4">
                            <h3 className="text-sm font-black uppercase tracking-widest text-[#006E46] flex items-center gap-3 text-center sm:text-left">
                                <div className="w-1.5 h-6 rounded-full bg-[#006E46]"></div>
                                Análisis Comparativo de Eficiencia por Área
                            </h3>
                            <div className="flex gap-6">
                                <div className="flex items-center gap-2">
                                    <div className="w-3 h-3 rounded-full bg-[#006E46]"></div>
                                    <span className="text-[10px] font-bold uppercase text-slate-400">Gasto ($)</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-3 h-3 rounded-full bg-[#00AE6E]"></div>
                                    <span className="text-[10px] font-bold uppercase text-slate-400">Viajes (Qty)</span>
                                </div>
                            </div>
                        </div>
                        <div className="h-[350px] w-full">
                            <ResponsiveContainer width="100%" height="100%">
                                <ComposedChart data={chartDataArea} margin={{ top: 10, right: 10, left: -10, bottom: 0 }}>
                                    <CartesianGrid vertical={false} strokeDasharray="3 3" stroke="#f1f5f9" />
                                    <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fill: '#64748b', fontSize: 10, fontWeight: 'bold'}} />
                                    <YAxis yAxisId="left" axisLine={false} tickLine={false} tick={{fill: '#64748b', fontSize: 10}} />
                                    <YAxis yAxisId="right" orientation="right" axisLine={false} tickLine={false} tick={{fill: '#00AE6E', fontSize: 10}} />
                                    <Tooltip 
                                        contentStyle={{borderRadius: '20px', border: 'none', boxShadow: '0 10px 30px rgba(0,0,0,0.1)', fontSize: '12px'}}
                                        formatter={(val, name) => [name === 'monto' ? formatCurrency(val) : val, name === 'monto' ? 'Inversión' : 'Viajes']}
                                    />
                                    <Bar yAxisId="left" dataKey="monto" fill="#006E46" radius={[10, 10, 0, 0]} barSize={40} />
                                    <Bar yAxisId="right" dataKey="viajes" fill="#00AE6E" radius={[10, 10, 0, 0]} barSize={40} />
                                </ComposedChart>
                            </ResponsiveContainer>
                        </div>
                    </div>

                    <footer className="text-center text-slate-400 text-[10px] font-black uppercase tracking-[0.8em] py-10">
                        Inteligencia Financiera • CFE Calificados • 2025
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
