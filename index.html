<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Uber 2025 - CFE Calificados</title>
    <!-- Librerías Necesarias en orden correcto -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #F1F5F9;
        }
        .cfe-gradient {
            background: linear-gradient(135deg, #006E46 0%, #00AE6E 100%);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // Acceso seguro a Recharts
        const { 
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, 
            ResponsiveContainer, ComposedChart, Cell, AreaChart, Area 
        } = window.Recharts;

        // Componente de Iconos Robusto con fallbacks SVG
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                DollarSign: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>,
                Car: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>,
                TrendingUp: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
                Users: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
                Search: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
                ShieldCheck: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>,
                X: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
                Info: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            };
            return icons[name] || null;
        };

        const CFE_COLORS = {
            primary: '#006E46',
            secondary: '#00AE6E',
            support: '#5C6670',
            greenLight: '#A1D55D',
            yellow: '#FFDB58',
            grayLight: '#A2AAAD',
            dark: '#004D31'
        };

        // --- DATOS REALES (907 viajes | $159,589.21 total) ---
        const DATA = [
            {num: 1, nombre: "Adriana García Limón", area: "Administración", totalViajes: 20, totalMonto: 3149.40},
            {num: 2, nombre: "Ana Cecilia Moreno Mejia", area: "Administración", totalViajes: 196, totalMonto: 31932.51},
            {num: 3, nombre: "Cervando Ponce Bejero", area: "Administración", totalViajes: 85, totalMonto: 11160.03},
            {num: 4, nombre: "César Román Baños Zavala", area: "Administración", totalViajes: 3, totalMonto: 219.89},
            {num: 5, nombre: "Jesus Ricardo López Hernández", area: "Administración", totalViajes: 160, totalMonto: 27795.53},
            {num: 6, nombre: "Marco A. Pérez de Acha", area: "Administración", totalViajes: 6, totalMonto: 474.85},
            {num: 7, nombre: "Saúl Guillermo Medina García", area: "Administración", totalViajes: 26, totalMonto: 6998.74},
            {num: 8, nombre: "Zulema Osorio Amarillas", area: "Administración", totalViajes: 1, totalMonto: 460.52},
            {num: 9, nombre: "Arturo Gibran Jaimes Vera", area: "Atención y Servicio al Cliente", totalViajes: 23, totalMonto: 5185.20},
            {num: 10, nombre: "Ashanti Avendaño Vargas", area: "Atención y Servicio al Cliente", totalViajes: 3, totalMonto: 568.92},
            {num: 11, nombre: "Felix Higinio Rivera Baqueiro", area: "Atención y Servicio al Cliente", totalViajes: 26, totalMonto: 4873.95},
            {num: 12, nombre: "Flora Elba Montero Navarrete", area: "Atención y Servicio al Cliente", totalViajes: 25, totalMonto: 4664.50},
            {num: 13, nombre: "Jhoan Gerardo Morales Chino", area: "Atención y Servicio al Cliente", totalViajes: 15, totalMonto: 3319.29},
            {num: 14, nombre: "Miguel Angel Rodríguez Peña", area: "Atención y Servicio al Cliente", totalViajes: 11, totalMonto: 2984.29},
            {num: 15, nombre: "Valentin Zavala Zavala", area: "Atención y Servicio al Cliente", totalViajes: 61, totalMonto: 13860.12},
            {num: 16, nombre: "Benjamin Felix Lepe", area: "Comercial", totalViajes: 15, totalMonto: 2739.76},
            {num: 17, nombre: "Edith Marín Rojas", area: "Comercial", totalViajes: 9, totalMonto: 1210.81},
            {num: 18, nombre: "Karla Avalos Ovando", area: "Comercial", totalViajes: 12, totalMonto: 2171.62},
            {num: 19, nombre: "María Cristina Núñez López", area: "Comercial", totalViajes: 8, totalMonto: 1771.84},
            {num: 20, nombre: "Raúl González Martínez", area: "Comercial", totalViajes: 3, totalMonto: 229.75},
            {num: 21, nombre: "Edgar Alejandro Mosqueda Mendez", area: "Finanzas", totalViajes: 9, totalMonto: 1354.77},
            {num: 22, nombre: "Adriana Terán Martínez", area: "Gestión de Energía", totalViajes: 1, totalMonto: 55.07},
            {num: 23, nombre: "Alejandro Adame Ramírez", area: "Gestión de Energía", totalViajes: 8, totalMonto: 942.67},
            {num: 24, nombre: "Carlos Gamma Gutiérrez", area: "Gestión de Energía", totalViajes: 5, totalMonto: 2463.48},
            {num: 25, nombre: "Julio César Hernández Luna", area: "Gestión de Energía", totalViajes: 3, totalMonto: 499.95},
            {num: 26, nombre: "Daniel Alberto Leal Nava", area: "Jurídico", totalViajes: 34, totalMonto: 6484.84},
            {num: 27, nombre: "Felipe Tadeo Rico Viccon", area: "Jurídico", totalViajes: 89, totalMonto: 15028.62},
            {num: 28, nombre: "Francisco Orozco Suárez", area: "Jurídico", totalViajes: 2, totalMonto: 419.90},
            {num: 29, nombre: "Guadalupe Cruz Sánchez", area: "Jurídico", totalViajes: 4, totalMonto: 346.66},
            {num: 30, nombre: "Hector Gerardo Tellez Quintanilla", area: "Jurídico", totalViajes: 1, totalMonto: 129.96},
            {num: 31, nombre: "Jonatan S. Duarte Montes de Oca", area: "Jurídico", totalViajes: 9, totalMonto: 1341.76},
            {num: 32, nombre: "Pedro Rodríguez Catachea", area: "Jurídico", totalViajes: 34, totalMonto: 4750.01}
        ];

        const AREAS_LIST = ["Todas", "Administración", "Atención y Servicio al Cliente", "Comercial", "Finanzas", "Gestión de Energía", "Jurídico"];

        const formatCurrency = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(val);

        function App() {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedArea, setSelectedArea] = useState('Todas');
            const [selectedPerson, setSelectedPerson] = useState(null);

            const filteredList = useMemo(() => {
                let result = DATA;
                if (selectedArea !== 'Todas') result = result.filter(d => d.area === selectedArea);
                if (searchTerm) result = result.filter(d => d.nombre.toLowerCase().includes(searchTerm.toLowerCase()));
                return result;
            }, [selectedArea, searchTerm]);

            const stats = useMemo(() => {
                const totalAmount = filteredList.reduce((acc, curr) => acc + curr.totalMonto, 0);
                const totalTrips = filteredList.reduce((acc, curr) => acc + curr.totalViajes, 0);
                return { totalAmount, totalTrips, avg: totalTrips > 0 ? totalAmount / totalTrips : 0 };
            }, [filteredList]);

            const chartDataArea = useMemo(() => {
                return AREAS_LIST.filter(a => a !== 'Todas').map(area => {
                    const perArea = DATA.filter(p => p.area === area);
                    const monto = perArea.reduce((sum, p) => sum + p.totalMonto, 0);
                    const viajes = perArea.reduce((sum, p) => sum + p.totalViajes, 0);
                    return { name: area.split(' ')[0], monto, viajes, fullName: area };
                }).sort((a, b) => b.monto - a.monto);
            }, []);

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col items-center">
                    <div className="w-full max-w-7xl">
                        
                        {/* HEADER */}
                        <header className="mb-8 rounded-[2rem] overflow-hidden shadow-2xl">
                            <div className="cfe-gradient p-8 md:p-12 text-white flex flex-col lg:flex-row justify-between items-center gap-6 relative">
                                <div className="flex flex-col sm:flex-row items-center gap-6 z-10 text-center sm:text-left">
                                    <div className="bg-white p-4 rounded-3xl shadow-xl flex-shrink-0">
                                        <div className="text-[#006E46] font-black text-xl">CFE</div>
                                    </div>
                                    <div>
                                        <div className="flex items-center justify-center sm:justify-start gap-2 mb-1 text-[#A1D55D]">
                                            <Icon name="ShieldCheck" size={16} />
                                            <span className="text-[10px] font-black uppercase tracking-[0.3em]">CFE Calificados</span>
                                        </div>
                                        <h1 className="text-3xl md:text-5xl font-black tracking-tighter italic">Reporte Uber 2025</h1>
                                    </div>
                                </div>

                                <div className="z-10 flex items-center gap-3 bg-black/10 p-2 rounded-2xl backdrop-blur-md border border-white/10 w-full lg:w-auto">
                                    <div className="flex items-center gap-2 px-4 py-2 w-full">
                                        <span className="text-[#A1D55D] font-bold text-xs uppercase">Área:</span>
                                        <select 
                                            className="bg-transparent text-xs font-bold outline-none cursor-pointer w-full text-white"
                                            value={selectedArea}
                                            onChange={(e) => setSelectedArea(e.target.value)}
                                        >
                                            {AREAS_LIST.map(a => <option key={a} value={a} style={{color: '#334155'}}>{a}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* KPIs */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                            <div className="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-[#006E46]">
                                <div className="p-3 rounded-xl bg-[#006E46] text-white w-fit mb-4 shadow-lg"><Icon name="DollarSign" /></div>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Inversión Total</p>
                                <h3 className="text-2xl font-black text-[#006E46]">{formatCurrency(stats.totalAmount)}</h3>
                            </div>
                            <div className="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-[#00AE6E]">
                                <div className="p-3 rounded-xl bg-[#00AE6E] text-white w-fit mb-4 shadow-lg"><Icon name="Car" /></div>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Viajes Totales</p>
                                <h3 className="text-2xl font-black text-[#006E46]">{stats.totalTrips.toLocaleString()}</h3>
                            </div>
                            <div className="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-[#5C6670]">
                                <div className="p-3 rounded-xl bg-[#5C6670] text-white w-fit mb-4 shadow-lg"><Icon name="TrendingUp" /></div>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Costo Promedio</p>
                                <h3 className="text-2xl font-black text-[#006E46]">{formatCurrency(stats.avg)}</h3>
                            </div>
                            <div className="bg-white p-6 rounded-[2rem] shadow-sm border-b-4 border-[#A2AAAD]">
                                <div className="p-3 rounded-xl bg-[#A2AAAD] text-white w-fit mb-4 shadow-lg"><Icon name="Users" /></div>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Plantilla</p>
                                <h3 className="text-2xl font-black text-[#006E46]">32</h3>
                            </div>
                        </div>

                        {/* GRAFICO AREA */}
                        <div className="bg-white p-6 md:p-10 rounded-[3rem] shadow-sm mb-10 overflow-hidden">
                            <h3 className="text-sm font-black uppercase tracking-widest flex items-center gap-3 mb-10 text-[#006E46]">
                                <div className="w-1.5 h-6 rounded-full bg-[#006E46]"></div>
                                Análisis por Centro de Costos (Anual)
                            </h3>
                            <div className="h-[300px] md:h-[400px] w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <ComposedChart data={chartDataArea} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                        <CartesianGrid vertical={false} strokeDasharray="3 3" stroke="#f1f5f9" />
                                        <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fill: '#5C6670', fontSize: 10, fontWeight: 'bold'}} />
                                        <YAxis yAxisId="left" axisLine={false} tickLine={false} tick={{fill: '#5C6670', fontSize: 10}} tickFormatter={(v) => `$${v/1000}k`} />
                                        <YAxis yAxisId="right" orientation="right" axisLine={false} tickLine={false} tick={{fill: '#00AE6E', fontSize: 10}} />
                                        <Tooltip 
                                            contentStyle={{borderRadius: '20px', border: 'none', boxShadow: '0 10px 30px rgba(0,0,0,0.1)', fontSize: '12px'}}
                                            formatter={(value, name) => name === "monto" ? [formatCurrency(value), "Gasto"] : [value, "Viajes"]}
                                        />
                                        <Bar yAxisId="left" dataKey="monto" fill="#006E46" radius={[10, 10, 0, 0]} barSize={40} />
                                        <Bar yAxisId="right" dataKey="viajes" fill="#00AE6E" radius={[10, 10, 0, 0]} barSize={40} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* TABLA Y BUSCADOR */}
                        <div className="grid grid-cols-1 xl:grid-cols-4 gap-8 mb-12 items-start">
                            <div className="xl:col-span-3 bg-white rounded-[2.5rem] shadow-sm overflow-hidden">
                                <div className="p-8 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-6">
                                    <div className="flex items-center gap-4">
                                        <div className="p-3 bg-slate-50 text-slate-400 rounded-2xl shadow-inner"><Icon name="Search" size={18} /></div>
                                        <h3 className="text-sm font-black uppercase tracking-widest text-slate-800">Auditoría Individual</h3>
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="Buscar por nombre..." 
                                        className="w-full md:w-80 px-6 py-3 bg-slate-50 border border-slate-100 rounded-2xl text-xs font-bold focus:ring-4 focus:ring-[#006E46]/10 outline-none transition-all"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>
                                <div className="overflow-x-auto custom-scrollbar">
                                    <table className="w-full text-left text-xs min-w-[600px]">
                                        <thead>
                                            <tr className="bg-slate-50/80 text-slate-400 font-black uppercase tracking-widest border-b border-slate-100">
                                                <th className="px-8 py-5">Colaborador</th>
                                                <th className="px-8 py-5">Área</th>
                                                <th className="px-8 py-5 text-center">Viajes</th>
                                                <th className="px-8 py-5 text-right">Inversión</th>
                                                <th className="px-8 py-5"></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50">
                                            {filteredList.map((person) => (
                                                <tr 
                                                    key={person.num} 
                                                    onClick={() => setSelectedPerson(person)}
                                                    className={`hover:bg-emerald-50 transition-all cursor-pointer group ${selectedPerson?.num === person.num ? 'bg-emerald-50' : ''}`}
                                                >
                                                    <td className="px-8 py-5">
                                                        <p className="font-black text-slate-800 group-hover:text-[#006E46]">{person.nombre}</p>
                                                        <p className="text-[9px] text-slate-400 uppercase tracking-widest">ID: {String(person.num).padStart(3, '0')}</p>
                                                    </td>
                                                    <td className="px-8 py-5">
                                                        <span className="text-[9px] font-black px-3 py-1 rounded-xl bg-white border border-slate-200 text-slate-500 uppercase">{person.area}</span>
                                                    </td>
                                                    <td className="px-8 py-5 text-center font-bold text-slate-600">{person.totalViajes}</td>
                                                    <td className="px-8 py-5 text-right font-black text-slate-900">{formatCurrency(person.totalMonto)}</td>
                                                    <td className="px-8 py-5 text-right"><span className="text-slate-300">→</span></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* FICHA TECNICA */}
                            <div className="xl:col-span-1">
                                {selectedPerson ? (
                                    <div className="bg-[#004D31] text-white p-8 rounded-[3rem] shadow-2xl animate-in fade-in slide-in-from-right-4 duration-500 sticky top-6">
                                        <div className="flex justify-between items-start mb-10">
                                            <div className="p-3 bg-white/10 rounded-2xl backdrop-blur-md shadow-lg border border-white/5"><Icon name="Users" size={20} /></div>
                                            <button onClick={() => setSelectedPerson(null)} className="text-white/40 hover:text-white"><Icon name="X" size={20} /></button>
                                        </div>
                                        <h3 className="text-xl font-black tracking-tight mb-1">{selectedPerson.nombre}</h3>
                                        <p className="text-[10px] font-black text-[#A1D55D] uppercase tracking-[0.4em] mb-10">{selectedPerson.area}</p>
                                        <div className="space-y-4 mb-8">
                                            <div className="bg-black/20 p-4 rounded-2xl">
                                                <p className="text-[8px] font-black text-white/30 uppercase tracking-widest mb-1">Gasto Total Anual</p>
                                                <p className="text-lg font-black">{formatCurrency(selectedPerson.totalMonto)}</p>
                                            </div>
                                            <div className="bg-black/20 p-4 rounded-2xl">
                                                <p className="text-[8px] font-black text-white/30 uppercase tracking-widest mb-1">Viajes Realizados</p>
                                                <p className="text-lg font-black">{selectedPerson.totalViajes} Viajes</p>
                                            </div>
</ div >  
                                        </div>
                                        <div className="flex items-start gap-4 p-4 bg-white/5 rounded-2xl">
                                            <Icon name="Info" size={16} className="text-[#A1D55D] shrink-0" />
                                            <p className="text-[10px] font-bold text-white/80 leading-relaxed">Costo promedio de {formatCurrency(selectedPerson.totalMonto / selectedPerson.totalViajes)} por servicio auditado.</p>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="h-full bg-white border-4 border-dashed border-slate-200 rounded-[3rem] p-10 flex flex-col items-center justify-center text-center opacity-60 min-h-[300px]">
                                        <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.3em]">Seleccione un colaborador para auditoría técnica</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        <footer className="text-center text-slate-300 text-[10px] font-black uppercase tracking-[0.8em] py-16 border-t border-slate-100">
                            Gestión de Datos • CFE Calificados • Auditoría 2025
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
